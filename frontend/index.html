<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 경비 AI 비서</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>✈️ 여행 경비 AI 비서</h1>
    <button id="themeBtn" title="다크 모드">🌙</button>
  </header>
  <div id="wake" class="notice">서버 깨우는 중… 무료 서버라 첫 요청은 최대 1분 걸릴 수 있어요.</div>

  <main>
    <section id="summaryBox" class="card">
      <h2>데이터 요약</h2>
      <div id="summary">불러오는 중…</div>
      <canvas id="chart" width="600" height="180"></canvas>
      <div class="row">
        <button id="csvBtn">CSV 내보내기</button>
        <button id="jsonBtn">JSON 내보내기</button>
      </div>
    </section>

    <section class="card chat">
      <h2>AI 채팅</h2>
      <div id="messages"></div>
      <div id="loading" hidden>AI가 답변을 생성하는 중…</div>
      <form id="chatForm" class="row">
        <input id="chatInput" placeholder="예: 가장 많이 쓴 날은?" maxlength="1000" required>
        <button>보내기</button>
      </form>
    </section>

    <section class="card">
      <h2>대화 기록</h2>
      <button id="newConv">+ 새 대화</button>
      <ul id="convList"></ul>
    </section>

    <section class="card">
      <h2>데이터 관리</h2>
      <form id="dataForm" class="row">
        <input type="date" id="dDate" required>
        <input type="number" id="dValue" min="0" placeholder="금액(원)" required>
        <input id="dMemo" placeholder="메모" maxlength="200">
        <button id="dSubmit">추가</button>
        <button type="button" id="dCancel" hidden>취소</button>
      </form>
      <div class="tablewrap">
        <table>
          <thead><tr><th>날짜</th><th>금액</th><th>메모</th><th></th></tr></thead>
          <tbody id="dataBody"></tbody>
        </table>
      </div>
      <div class="row"><button id="more">더 보기</button><span id="count"></span></div>
    </section>
  </main>

  <div id="toast"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
